# Builds the Android APK.
# - Run manually (Actions -> Build APK -> Run workflow) to get a test APK as a build artifact.
# - Push a tag like v0.2.0 to also publish a GitHub Release with the APK attached.
name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Install Flet CLI
      run: pip install "flet[all]==1.0.2"

    - name: Set up signing key
      # Without these secrets the APK is signed with a throwaway debug key and
      # can't be installed over a previous build without uninstalling first.
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
        echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

    - name: Build APK
      env:
        FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        VERSION_ARGS=""
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION_ARGS="--build-version ${GITHUB_REF_NAME#v}"
        fi
        FLET=flet ./build.sh --build-number ${{ github.run_number }} $VERSION_ARGS

    - uses: actions/upload-artifact@v4
      with:
        name: otapp-apk
        path: dist/*.apk

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.apk
        generate_release_notes: true
